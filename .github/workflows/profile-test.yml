name: profile-test

on:
  push:
  pull_request:

jobs:
  profile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: make syntax
      - name: CLI color test
        run: php -d zend.assertions=1 -d assert.exception=1 tests/cli-style.php
      - name: Semgrep rules
        run: make semgrep-rules
      - name: Profile tests
        run: make profile-test
