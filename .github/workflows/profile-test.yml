name: profile-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  profile-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: make syntax
      - name: CLI color test
        run: php -d zend.assertions=1 -d assert.exception=1 tests/cli-style.php
      - name: Semgrep rules
        run: make semgrep-rules
      - name: Profile tests
        run: make profile-test
