name: profile-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  profile-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: make syntax
      - name: Engineering language policy
        env:
          NINFA_LANGUAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make language-check
      - name: CLI color test
        run: php -d zend.assertions=1 -d assert.exception=1 tests/cli-style.php
      - name: Semgrep rules
        run: make semgrep-rules
      - name: Profile tests
        run: make profile-test
